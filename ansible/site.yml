---
- name: Configurar servidores web
  hosts: web
  become: true
  tasks:
    - name: Instalar nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Copiar configuracion de la aplicacion
      ansible.builtin.copy:
        src: files/app.conf
        dest: /etc/nginx/conf.d/app.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reiniciar nginx

    - name: Descargar script
      ansible.builtin.get_url:
        url: https://example.com/setup.sh
        dest: /tmp/setup.sh
        mode: "0644"

  handlers:
    - name: Reiniciar nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
